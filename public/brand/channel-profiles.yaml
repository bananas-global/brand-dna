schema_version: "1.0"
rule:
  preserve:
    - promise
    - expression_principles
    - voice_invariants
    - accessibility
    - ethical_boundaries
  flexible:
    - density
    - rhythm
    - proportion
    - call_to_action
    - expressiveness

profiles:
  presentations:
    job: "Guide a decision through a narrative sequence."
    density: "30 to 60 words per slide, excluding appendices."
    structure: [context, tension, evidence, proposal, next_step]
    image_role: evidence
    data_rule: "Every chart must state its conclusion."
  proposals:
    job: "Turn understanding into a clear agreement."
    tone: "Confident, precise, and not grandiose."
    structure: [context, approach, scope, evidence, investment, next_step]
    invariants:
      - "Scope and conditions must not be ambiguous."
  social:
    job: "Create relevant attention and open a conversation."
    rhythm: expressive
    structure: [specific_hook, single_idea, useful_detail, invitation]
    constraints:
      - "Use minimal copy inside the artwork."
      - "The caption adds depth; it does not repeat."
  web:
    job: "Guide, prove, and invite action."
    structure: [promise, relevance, proof, detail, action]
    invariants:
      - "Responsive hierarchy."
      - "Visible focus and valid contrast."
      - "Motion explains change."
  business_intelligence:
    job: "Reduce the time between reading and decision."
    density: high_but_scannable
    invariants:
      - "Every KPI includes its unit and period."
      - "Semantic color includes a redundant text cue."
      - "Scales do not dramatize differences."
      - "Relevant deviations receive an annotation."
