schema_version: "1.0"
brand:
  name: "[BRAND NAME]"
  document_status: template
  language: en-US
  last_reviewed: "[YYYY-MM-DD]"
  owner: "[OWNING TEAM OR PERSON]"

essence:
  central_idea: "[A short truth that guides every choice.]"
  purpose: "[The concrete change the brand wants to enable.]"
  role: "[How it participates in people’s lives.]"
  tension: "[The cultural or human conflict it helps resolve.]"
  promise: "[The experience that should repeat at every touchpoint.]"

positioning:
  statement: "For [audience], we are the [category] that [benefit], because [proof]."
  primary_audience:
    description: "[Who experiences the problem and chooses the solution.]"
    needs: []
    barriers: []
    decision_criteria: []
  influencing_audience:
    description: "[Who recommends, approves, or enables the decision.]"
    needs: []
    risks: []

decision_priority:
  - truth
  - clarity
  - distinction
  - channel_fit

expression_principles:
  - id: clear_not_simplistic
    intent: "Reduce effort without erasing nuance."
    invariants:
      - "Orient before going deeper."
    preferences:
      - "One main idea per unit of communication."
    avoid:
      - "Simplifying to the point of distortion."
    examples:
      approved: "See what changes your decision first."
      negative: "Discover a revolutionary universe of possibilities."
  - id: human_not_forced
    intent: "Show attention without simulating intimacy."
    invariants:
      - "Speak to people, not abstract segments."
    preferences:
      - "Use active voice and concrete verbs."
    avoid:
      - "Slang or intimacy that the context does not justify."
  - id: vivid_not_noisy
    intent: "Use contrast to create energy and hierarchy."
    invariants:
      - "Expression must never reduce comprehension."
    preferences:
      - "Reserve intensity for one idea at a time."
    avoid:
      - "Competition among multiple focal points."

voice:
  intent: "Say what matters with precision and leave a door open."
  invariants:
    - "Start with the person’s need."
    - "Use concrete language."
    - "Indicate a possible next step."
  preferences:
    - "Short sentences."
    - "Active voice."
    - "Specific nouns and verbs."
  preferred_vocabulary:
    - start
    - compare
    - understand
    - choose
    - move_forward
    - review
  avoid_vocabulary:
    - disruptive
    - revolutionary
    - leading
    - unmissable
    - 360_solution

boundaries:
  never:
    - "Create artificial urgency."
    - "Hide relevant conditions."
    - "Imply certainty where risk exists."
    - "Use visual expression to decorate critical information."
  escalate_when:
    - "The application involves vulnerable audiences."
    - "There is high financial, legal, or health impact."
    - "The cultural context is sensitive."
    - "The exception is not covered by this contract."
