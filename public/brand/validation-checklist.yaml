schema_version: "1.0"
result_values: [pass, fail, not_applicable, needs_review]
checks:
  - id: strategy.promise
    question: "Is the promise accurate and supportable?"
    severity: blocking
  - id: strategy.audience
    question: "Are the audience and its need identified?"
    severity: required
  - id: channel.profile
    question: "Was the correct channel profile applied?"
    severity: required
  - id: voice.invariants
    question: "Does the copy respect the voice invariants?"
    severity: required
  - id: voice.jargon
    question: "Were jargon and unsupported superlatives removed?"
    severity: required
  - id: visual.assets
    question: "Are all assets marked as approved in the manifest?"
    severity: blocking
  - id: visual.tokens
    question: "Do color, typography, and spacing use canonical tokens?"
    severity: required
  - id: data.context
    question: "Do metrics state value, unit, period, and source?"
    severity: required
  - id: accessibility.contrast
    question: "Are contrast, legibility, focus, and motion accessible?"
    severity: blocking
  - id: boundaries.ethics
    question: "Does the material avoid artificial urgency, omission, and false certainty?"
    severity: blocking
  - id: governance.exception
    question: "Were exceptions documented and approved?"
    severity: required_if_applicable
